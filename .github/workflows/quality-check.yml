name: Quality Check

on:
  pull_request:
    paths:
      - ".github/workflows/quality-check.yml"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/deploy-job.yml"
      - "app/**"
      - "components/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "utils/**"
      - "Dockerfile"
      - "Dockerfile.job"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "proxy.ts"
      - "server.js"
      - "tsconfig.json"
      - "next-env.d.ts"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://kpkpkchwimcerqrdurnf.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AulFARm6kHiJUbu8cpd-og_OtFwhAyD

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and smoke tests
        run: npm test

      - name: Production build
        run: npm run build
